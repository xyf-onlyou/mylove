<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>love</title>
<link rel="manifest" href="./manifest.json">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#ffffff; --surface:#f4f4f4; --surface-2:#ececec;
  --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.22);
  --ink:#0a0a0a; --ink-2:#8a8a8a; --ink-3:#b3b3b3;
  --glass:rgba(255,255,255,.66); --glass-b:rgba(0,0,0,.08);
  --boost:#111111; --boost-ink:#ffffff; --in:#f2f2f2;
  --backdrop:#e8e8e8; --frame:#d8d8d8;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --bg:#080808; --surface:#151515; --surface-2:#1e1e1e;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
  --ink:#f6f6f6; --ink-2:#8f8f8f; --ink-3:#5e5e5e;
  --glass:rgba(16,16,16,.68); --glass-b:rgba(255,255,255,.10);
  --boost:#f6f6f6; --boost-ink:#080808; --in:#1a1a1a;
  --backdrop:#0d0d0d; --frame:#2b2b2b;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#080808; --surface:#151515; --surface-2:#1e1e1e;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.22);
    --ink:#f6f6f6; --ink-2:#8f8f8f; --ink-3:#5e5e5e;
    --glass:rgba(16,16,16,.68); --glass-b:rgba(255,255,255,.10);
    --boost:#f6f6f6; --boost-ink:#080808; --in:#1a1a1a;
    --backdrop:#0d0d0d; --frame:#2b2b2b;
  }
}

/* ============ 基础 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"PingFang SC","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  background:var(--backdrop); color:var(--ink);
  display:grid; place-items:center; min-height:100dvh; transition:background .4s var(--ease);
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font-family:inherit}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.tiny{width:13px;height:13px;stroke-width:1.8;opacity:.55;display:inline-block;vertical-align:1px;margin-left:4px}

/* ============ 机身 ============ */
.phone{
  position:relative; width:390px; height:844px; border-radius:46px; overflow:hidden;
  background:var(--bg); border:1.5px solid var(--frame);
  display:flex; flex-direction:column;
  transition:background .4s var(--ease), border-color .4s var(--ease);
}
@media (max-width:480px), (max-height:880px){
  body{padding:0}
  .phone{width:100vw;height:100dvh;border-radius:0;border:0}
}

/* 状态栏 */
.statusbar{
  flex:0 0 48px; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 26px 6px; font-size:13.5px; font-weight:600; letter-spacing:.02em; color:var(--ink);
}
.statusbar .sb-r{display:flex;align-items:center;gap:6px;opacity:.9}
.statusbar .ic{width:15px;height:15px;stroke-width:2}
.statusbar .batt{display:flex;align-items:center;gap:5px}
.statusbar .batt svg{overflow:visible}
.statusbar .batt span{font-size:12.5px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.statusbar .batt.low span{color:#e0322a}

/* ============ 视图容器 ============ */
.views{position:relative;flex:1;overflow:hidden}
.view{
  position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
  padding:0 20px 132px;display:none;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none}
.view.active{display:block;animation:viewIn .42s var(--ease) both}

/* 页头 */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 18px}
.page-sub{font-size:12px;color:var(--ink-3);letter-spacing:.14em;margin:0 0 6px 2px;font-weight:500}
/* 衬线斜体大标题（近似 Playfair / Didot Italic 观感） */
.page-title{
  font-family:"Playfair Display","Didot","Bodoni 72","Georgia","Songti SC","Times New Roman",serif;
  font-size:42px;line-height:1.12;margin:0;font-weight:700;font-style:italic;
  letter-spacing:-.005em;padding-right:8px;
}
.head-actions{display:flex;gap:10px;align-items:center;padding-bottom:4px}
.icon-btn{
  width:42px;height:42px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;color:var(--ink);
  transition:transform .28s var(--ease), background .25s, color .25s, border-color .25s;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}.icon-btn .ic{width:20px;height:20px}

/* ============ 分段控件 ============ */
.seg{position:relative;display:grid;background:var(--surface);border-radius:999px;padding:4px;height:46px;margin-bottom:12px}
.seg-pill{
  position:absolute;top:4px;left:4px;height:calc(100% - 8px);border-radius:999px;
  background:var(--bg);border:1px solid var(--line);
  transition:transform .44s var(--ease);
}
.seg button{position:relative;z-index:1;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);transition:color .3s var(--ease)}
.seg button.active{color:var(--ink);font-weight:600}

/* ============ 搜索 ============ */
.search{
  display:flex;align-items:center;gap:8px;height:48px;border-radius:18px;
  background:var(--surface);padding:0 16px;margin-bottom:14px;
  transition:border-color .3s;
  border:1px solid transparent;
}
.search:focus-within{border-color:var(--line-2)}
.search .ic{width:18px;height:18px;color:var(--ink-3);flex:0 0 auto}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);height:100%}
.search input::placeholder{color:var(--ink-3)}

/* ============ 聊天列表 ============ */
.chat-list{display:flex;flex-direction:column;gap:10px}
.chat-row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border-radius:22px;padding:12px 16px 12px 12px;
  transition:transform .3s var(--ease), background .3s;
  animation:pop .38s var(--ease) both;
}
.chat-row:active{transform:scale(.975)}
.avatar{
  flex:0 0 auto;width:52px;height:52px;border-radius:999px;border:1.3px solid var(--ink);
  display:grid;place-items:center;font-size:19px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em;background:transparent;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-name{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center}
.row-sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:11.5px;color:var(--ink-3);align-self:flex-start;padding-top:6px}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;line-height:2;padding:60px 0}
.empty span{font-size:12px;opacity:.8}

/* ============ 聊天详情 ============ */
.chat-detail{
  position:absolute;left:0;right:0;top:48px;bottom:0;background:var(--bg);z-index:35;
  transform:translateX(100%);transition:transform .46s cubic-bezier(.32,1,.36,1);
  display:flex;flex-direction:column;
}
.chat-detail.on{transform:none}
.chat-head{position:relative;padding:8px 14px 10px;display:flex;flex-direction:column;align-items:center}
.rbtn{
  position:absolute;top:12px;width:38px;height:38px;border-radius:999px;
  border:1px solid var(--glass-b);background:var(--glass);display:grid;place-items:center;
  backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  color:var(--ink);transition:transform .26s var(--ease),background .3s;
}
.rbtn:active{transform:scale(.9)}
.rbtn .ic{width:19px;height:19px}
.rbtn.back{left:14px}
.rbtn.decide{right:14px}
.chat-head-main{display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:2px}
.avatar.lg{width:60px;height:60px;font-size:22px}
.name-pill{
  display:flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  font-size:13.5px;font-weight:600;color:var(--ink);
  transition:background .3s, transform .26s var(--ease);
}
.name-pill:active{transform:scale(.95)}
.name-pill .ic{width:14px;height:14px;stroke-width:2;color:var(--ink-2);transition:transform .38s var(--ease)}
.name-pill.open .ic{transform:rotate(180deg)}
.chat-tools{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .44s var(--ease), opacity .3s var(--ease), margin-top .44s var(--ease);
}
.chat-tools.open{max-height:160px;opacity:1;margin-top:12px}
.tool{
  width:66px;height:66px;border-radius:20px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:10.5px;color:var(--ink-2);letter-spacing:-.02em;
  transition:transform .26s var(--ease),background .3s;
}
.tool:active{transform:scale(.92)}
#deleteGroupTool{width:58px}
.tool .ic{width:20px;height:20px;color:var(--ink)}

/* 消息区 */.msg-scroll{flex:1;overflow-y:auto;padding:6px 18px 116px;scrollbar-width:none}
.msg-scroll::-webkit-scrollbar{display:none}
.day{text-align:center;font-size:11.5px;color:var(--ink-3);margin:12px 0 16px;letter-spacing:.06em}
.stamp{text-align:center;font-size:11px;color:var(--ink-3);margin:16px 0 8px}
.sys{text-align:center;font-size:11.5px;color:var(--ink-3);margin:14px 0;letter-spacing:.02em}
.msg{display:flex;align-items:flex-end;margin:9px 0;min-width:0}
.msg.is-new,.sys.is-new{animation:pop .38s var(--ease) both}
.msg.out{justify-content:flex-end}
/* 涂鸦消息沿用发送者方向：用户右侧，角色左侧 */
.msg.out .msgwrap{margin-left:auto}
.msg.in .msgwrap{margin-right:auto}
.bubble{
  position:relative;
  display:block;width:fit-content;max-width:100%;min-width:0;box-sizing:border-box;
  padding:10px 15px;border-radius:19px;
  font-size:var(--bub-size,15px);line-height:1.55;font-weight:400;
  background:var(--bub-peer,var(--in));color:var(--ink);
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;
  letter-spacing:0;text-align:left;
}
.msg.out .bubble{background:var(--bub-mine,var(--boost));color:var(--boost-ink)}
#chatDetail.glass-bub .bubble{
  background:var(--glass)!important;color:var(--ink)!important;
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  border:1px solid var(--glass-b);
}
#chatDetail.glass-bub .msg.out .bubble{
  background:rgba(17,17,17,.62)!important;color:#fff!important;border-color:rgba(255,255,255,.16);
}
.bubble.media-bubble{padding:5px;background:var(--surface);max-width:100%;overflow:hidden}
.bubble.media-bubble img,.bubble.media-bubble video{display:block;width:auto;max-width:100%;height:auto;max-height: min(56vh,520px);object-fit:contain;border-radius:13px}
.msg .msgwrap{max-width:min(82%, 420px)}
.typing{display:flex;gap:4px;padding:14px 16px;background:var(--in);border-radius:19px}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--ink-3);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

/* 引用预览：固定在输入栏正上方，不覆盖消息 */
.quote-preview{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:calc(100% - 44px);max-width:330px;min-height:38px;display:none;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 3px 14px rgba(0,0,0,.07);z-index:7;box-sizing:border-box}
.quote-preview.on{display:flex}
.quote-preview-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;text-align:center}
.quote-preview-label{font-size:10px;line-height:1.2;color:var(--ink-3)}
.quote-preview-text{font-size:11.5px;line-height:1.35;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-preview-close{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:18px;line-height:1;background:transparent}
/* 输入栏 */
.composer{
  position:absolute;left:14px;right:14px;bottom:20px;height:52px;
  display:flex;align-items:center;gap:6px;padding:0 7px;
  border-radius:999px;background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  z-index:5;
}
.cbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);transition:color .25s,transform .25s var(--ease),background .25s}
.cbtn:active{transform:scale(.88)}
.cbtn .ic{width:21px;height:21px}
.cbtn.on{color:var(--bg);background:var(--ink)}
.input-wrap{flex:1;display:flex;align-items:center;min-width:0}
.input-wrap input{
  width:100%;height:40px;border:0;background:none;outline:none;
  font-size:15px;color:var(--ink);padding:0 4px;
}
.input-wrap input::placeholder{color:var(--ink-3)}
.hold{
  flex:1;height:40px;border-radius:999px;border:1px solid var(--line-2);
  display:none;align-items:center;justify-content:center;font-size:14px;color:var(--ink);font-weight:500;
}
.composer.voice .input-wrap{display:none}
.composer.voice .hold{display:flex}
.composer.typed .cbtn.emoji,
.composer.typed .cbtn.plus{display:none}
.send{display:none}
.composer.typed .send{display:grid;animation:pop .3s var(--ease) both}
.send{background:var(--ink)!important;color:var(--bg)!important}

/* 表情 / 加号面板 */
.panel{
  position:absolute;left:14px;right:14px;bottom:86px;z-index:4;
  background:var(--glass);border:1px solid var(--glass-b);border-radius:26px;padding:14px;backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;
  transition:opacity .3s var(--ease),transform .34s var(--ease);
}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emoji-grid span{
  display:grid;place-items:center;height:42px;font-size:23px;border-radius:14px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Android Emoji",sans-serif;
  transition:background .2s,transform .2s var(--ease);
}
.emoji-grid span:active{background:var(--surface)}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);padding:4px 0}
.plus-item .box{width:52px;height:52px;border-radius:18px;background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:transform .24s var(--ease)}
.plus-item:active .box{transform:scale(.9)}

/* ============ 字卡库 ============ */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:40px;padding:0 17px;border-radius:999px;border:1px solid var(--line);
  font-size:13.5px;color:var(--ink-2);background:transparent;
  transition:background .3s var(--ease),color .3s,border-color .3s,transform .26s var(--ease);
}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.off{opacity:.42;text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.mini{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink);
  transition:transform .26s var(--ease),background .3s;
}
.mini:active{transform:scale(.94)}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.mini .ic{width:16px;height:16px}
.add-bar{
  display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 18px;margin-bottom:16px;
  border:1.4px dashed var(--line-2);border-radius:999px;transition:border-color .3s,background .3s;
}
.add-bar:focus-within{border-style:solid;border-color:var(--ink)}
.add-bar input{flex:1;border:0;background:none;outline:none;font-size:14.5px;color:var(--ink)}
.add-bar input::placeholder{color:var(--ink-3)}
.add-bar .plus-btn{width:38px;height:38px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .24s var(--ease)}
.add-bar .plus-btn:active{transform:scale(.88)}
.count{font-size:12px;color:var(--ink-3);margin:0 0 10px 4px;letter-spacing:.04em}
.card-list{display:flex;flex-direction:column;gap:9px}
.card-row{
  display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:18px;
  padding:0 8px 0 16px;min-height:52px;animation:pop .34s var(--ease) both;
  border:1px solid transparent;transition:border-color .3s;
}
.card-row:focus-within{border-color:var(--line-2)}
.card-input{flex:1;border:0;background:none;outline:none;font-size:14.5px;color:var(--ink);height:50px;padding:0}
.del-btn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3);transition:color .25s,background .25s,transform .24s var(--ease)}
.del-btn:active{transform:scale(.86)}
.del-btn:hover{color:var(--ink)}
.del-btn .ic{width:15px;height:15px;stroke-width:1.9}

/* ============ 发现 ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{
  aspect-ratio:1/1.06;border-radius:30px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:transform .32s var(--ease),background .3s;
}
.tile:active{transform:scale(.965)}
.tile .ic{width:38px;height:38px;stroke-width:1.45;color:var(--ink);stroke-linejoin:round;stroke-linecap:round}
.tile span{font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--ink)}

/* ============ 设置 ============ */
.me-top{display:flex;flex-direction:column;align-items:center;padding:6px 0 26px;gap:12px}
.avatar.xl{width:96px;height:96px;font-size:36px;transition:transform .4s var(--ease)}
.avatar.xl:active{transform:scale(.94)}
.me-hint{font-size:12px;color:var(--ink-3)}.field-label{font-size:12px;color:var(--ink-3);margin:0 0 8px 6px;letter-spacing:.06em}
.field{
  width:100%;height:52px;border-radius:999px;background:var(--surface);border:1px solid transparent;
  padding:0 18px;font-size:14.5px;color:var(--ink);outline:none;margin-bottom:20px;
  transition:border-color .3s,background .3s;
}
.field:focus{border-color:var(--line-2)}
.field::placeholder{color:var(--ink-3)}
.danger{
  width:100%;height:52px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink);
  transition:transform .26s var(--ease);
}
.danger:active{transform:scale(.98)}
.danger .ic{width:17px;height:17px}
.section-gap{height:22px}

/* ============ 底部导航（玻璃悬浮） ============ */
.tabbar{
  position:absolute;left:16px;right:16px;bottom:18px;height:74px;z-index:30;
  display:flex;align-items:center;padding:0 6px;
  border-radius:999px;border:1px solid var(--glass-b);
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:60px;justify-content:center;color:var(--ink-3);transition:color .32s var(--ease)}
.tab .ico{display:grid;place-items:center}
.tab .ic{width:23px;height:23px;transition:stroke-width .3s var(--ease),color .3s}
.tab .lbl{font-size:10.5px;letter-spacing:.06em;transition:color .3s,font-weight .2s,letter-spacing .3s}
.tab.active{color:var(--ink)}
.tab.active .ic{stroke-width:1.9}
/* 当前 tab 只用墨色深浅 + 字重区分，无描边、无底框 */
.tab.active .lbl{font-weight:600;letter-spacing:.08em}
button:focus,button:focus-visible,.tab:focus-visible{outline:none}
button{-webkit-focus-ring-color:transparent}

/* ============ 抽屉 / 提示 ============ */
.sheet-mask{
  position:absolute;inset:0;background:rgba(0,0,0,.22);z-index:40;opacity:0;pointer-events:none;
  transition:opacity .34s var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:30px 30px 0 0;padding:10px 20px 26px;
  transform:translateY(105%);transition:transform .46s cubic-bezier(.32,1,.36,1);
  max-height:88%;overflow-y:auto;scrollbar-width:none;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:4px;border-radius:99px;background:var(--surface-2);margin:0 auto 16px}
.sheet h3{font-size:16px;margin:0 0 16px;font-weight:600;letter-spacing:-.01em}
.sheet .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;height:52px;border-radius:999px;background:var(--surface);padding:0 18px;margin-bottom:10px;font-size:14px}
.sheet .row .v{color:var(--ink-2);font-size:13px}
.sheet textarea{
  width:100%;min-height:120px;border-radius:22px;background:var(--surface);border:1px solid transparent;
  padding:14px 16px;font-size:14px;line-height:1.6;color:var(--ink);outline:none;resize:none;
  transition:border-color .3s;
}
.sheet textarea:focus{border-color:var(--line-2)}
.sheet textarea::placeholder{color:var(--ink-3)}
.sheet .primary{
  width:100%;height:54px;border-radius:999px;background:var(--ink);color:var(--bg);
  font-size:15.5px;font-weight:600;margin-top:8px;transition:transform .26s var(--ease),opacity .3s;
}
.sheet .primary:active{transform:scale(.98)}
.sheet .ghost-btn{
  width:100%;height:52px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:14.5px;margin-top:10px;transition:background .3s;
}
.sheet .foot{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12.5px;color:var(--ink-2);margin-top:16px}
.switch{position:relative;width:48px;height:28px;display:inline-block;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{
  position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
  transition:background .3s var(--ease);
}
.switch span::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;
  background:var(--ink-3);transition:transform .34s var(--ease),background .3s;
}
.switch input:checked + span{background:var(--ink);border-color:var(--ink)}
.switch input:checked + span::after{transform:translateX(20px);background:var(--bg)}

.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,12px);z-index:60;
  background:var(--ink);color:var(--bg);font-size:13px;padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--ease);
  white-space:nowrap;max-width:86%;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ============ 子页面（朋友圈 / 一起听 / 占卜） ============ */
.subpage{
  position:absolute;left:0;right:0;top:48px;bottom:0;background:var(--bg);z-index:36;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .4s var(--ease), visibility 0s .4s;
  display:flex;flex-direction:column;overflow:hidden;
}
.subpage.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s var(--ease)}
#sp-playlist{z-index:37}
#sp-doc{z-index:39}
.sub-head{
  position:relative;
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 10px;gap:10px;
}
.sub-head .t{
  position:absolute;left:50%;transform:translateX(-50%);
  max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:15.5px;font-weight:600;letter-spacing:-.01em;
}
.sub-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 18px 110px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sub-body::-webkit-scrollbar{display:none}
.sub-back{
  width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink);transition:transform .24s var(--ease);
}
.sub-back:active{transform:scale(.9)}
.sub-back .ic{width:19px;height:19px}
.sub-act{width:38px;height:38px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .24s var(--ease)}
.sub-act:active{transform:scale(.9)}
.sub-act .ic{width:19px;height:19px;stroke-width:1.9}
.sub-acts{display:flex;align-items:center;gap:8px}
.sub-act.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}

/* ---------- 朋友圈 ---------- */
.mo-hero{margin-bottom:18px}
.mo-cover{
  position:relative;height:210px;border-radius:28px;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);
}
/* 底部渐隐，保证白字可读 */
.mo-cover::after{
  content:"";position:absolute;inset:auto 0 0 0;height:96px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,0));
}
/* 名字下方那条横线，名字固定贴在这条线之上 */
.mo-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mo-cover .ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--ink-3);font-size:12.5px;
}
.mo-cover .ph .ic{width:26px;height:26px}
.mo-cover .edit{
  position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:999px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;place-items:center;color:#0a0a0a;border:1px solid rgba(0,0,0,.08);
  transition:transform .24s var(--ease);
}
.mo-cover .edit:active{transform:scale(.9)}
.mo-cover .edit .ic{width:16px;height:16px}
.mo-id{position:relative;display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding:0 18px;margin-top:-33px}
.mo-ava{
  width:66px;height:66px;border-radius:999px;background:var(--bg);border:1.4px solid var(--ink);
  display:grid;place-items:center;font-size:23px;font-weight:600;flex:0 0 auto;position:relative;z-index:3;
  margin-left:auto;order:2;overflow:hidden;
}
.mo-ava img,.mo-top .mini-ava img,.letter-ava img,.divi-author .mini-ava img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
/* 个签在横线下方，靠左 */
.mo-card{
  background:var(--surface);border-radius:24px;padding:14px 15px 10px;margin-bottom:12px;
  animation:pop .38s var(--ease) both;
}
.mo-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mo-top .mini-ava{
  width:38px;height:38px;overflow:hidden;border-radius:999px;border:1.2px solid var(--ink);display:grid;place-items:center;
  font-size:14px;font-weight:600;flex:0 0 auto;background:var(--bg);
}
.mo-top .meta{flex:1;min-width:0}
.mo-top .meta .n{font-size:13.5px;font-weight:600}
.mo-top .meta .d{font-size:11px;color:var(--ink-3);margin-top:2px}
.mo-text{font-size:14.5px;line-height:1.55;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.mo-media{display:grid;gap:5px;margin-bottom:10px;border-radius:16px;overflow:hidden}
.mo-media.n1{grid-template-columns:1fr}
.mo-media.n2{grid-template-columns:1fr 1fr}.mo-media.n3,.mo-media.n4{grid-template-columns:1fr 1fr}
.mo-media .cell{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-2);border-radius:12px}
.mo-media.n1 .cell{aspect-ratio:4/3;border-radius:14px}
.mo-media .cell img,.mo-media .cell video{width:100%;height:100%;object-fit:cover;display:block}
.mo-media .cell .vbadge{
  position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  background:rgba(0,0,0,.22);
}
.mo-media .cell .vbadge .ic{width:30px;height:30px;stroke-width:1.5}
.mo-foot{display:flex;align-items:center;gap:6px;padding:2px 0 0}
.mo-btn{
  display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;
  font-size:12.5px;color:var(--ink-2);transition:background .24s,color .24s,transform .22s var(--ease);
}
.mo-btn:active{transform:scale(.93)}
.mo-btn .ic{width:16px;height:16px}
.mo-btn.liked{color:var(--ink);font-weight:600}
.mo-btn.liked .ic{fill:currentColor;stroke-width:1.2}
.mo-likes{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:6px 0 0}
.mo-comments{display:flex;flex-direction:column;gap:6px;padding:6px 0 0}
.mo-cm{font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--bg);border-radius:12px;padding:7px 10px}
.mo-cm b{font-weight:600;margin-right:5px}

/* 发布抽屉里的媒体选择 */
.pick-row{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.pick-add{
  width:62px;height:62px;border-radius:18px;border:1.4px dashed var(--line-2);
  display:grid;place-items:center;color:var(--ink-2);transition:transform .24s var(--ease),border-color .24s;
}
.pick-add:active{transform:scale(.92)}
.pick-add .ic{width:20px;height:20px}
.pick-thumb{position:relative;width:62px;height:62px;border-radius:18px;overflow:hidden;background:var(--surface-2)}
.pick-thumb img,.pick-thumb video{width:100%;height:100%;object-fit:cover}
.pick-thumb .x{
  position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:999px;
  background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;
}
.pick-thumb .x .ic{width:11px;height:11px;stroke-width:2.4}

/* ---------- 一起听 ---------- */
.mt-head{display:flex;flex-direction:column;align-items:center;padding:4px 0 18px}
.mt-pair{display:flex;align-items:center;gap:0;margin-bottom:16px}
.mt-pair .avx{
  width:58px;height:58px;border-radius:999px;border:1.3px solid var(--ink);display:grid;place-items:center;
  font-size:19px;font-weight:600;background:var(--bg);position:relative;z-index:1;overflow:hidden;
}
.mt-pair .avx img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}

.mt-pair .link{
  width:52px;height:26px;position:relative;display:grid;place-items:center;
  border-top:1.2px dashed var(--line-2);border-bottom:1.2px dashed var(--line-2);
}
.mt-pair .link i{
  width:100%;height:1.2px;
  background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 9px);
  animation:flow .9s linear infinite;
}
@keyframes flow{from{background-position:0 0}to{background-position:9px 0}}
.mt-state{font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}
.mt-state b{color:var(--ink);font-weight:600}

.mt-disc{
  width:230px;height:230px;border-radius:999px;margin:6px auto 22px;position:relative;
  border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;
  overflow:hidden;
}
.mt-disc.spin{animation:spin 18s linear infinite}
.mt-disc.spin.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.mt-disc .groove{position:absolute;inset:16px;border-radius:999px;border:1px solid var(--line)}
.mt-disc .groove.g2{inset:34px}
.mt-disc .groove.g3{inset:52px}
.mt-disc .lbl{position:relative;z-index:1;text-align:center;font-size:11px;color:var(--ink-3);letter-spacing:.18em;text-transform:uppercase}
.mt-disc .center{
  position:absolute;width:74px;height:74px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);display:grid;place-items:center;font-size:20px;z-index:2;
}
.mt-song{text-align:center;margin-bottom:6px}
.mt-song .st{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
.mt-song .sa{font-size:12.5px;color:var(--ink-2)}
.mt-prog{display:flex;align-items:center;gap:10px;margin:20px 2px 4px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mt-track{flex:1;height:3px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.mt-track i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:99px;width:0;transition:width .3s linear}.mt-ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:16px 0 6px}
.mt-mode{
  height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:11.5px;color:var(--ink-2);white-space:nowrap;min-width:66px;
  transition:background .3s,color .3s,transform .24s var(--ease);
}
.mt-mode:active{transform:scale(.94)}
.mt-invite{
  height:40px;padding:0 18px;border-radius:999px;border:1.3px solid var(--ink);background:transparent;
  font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;
  transition:transform .24s var(--ease),background .3s;
}
.mt-invite:active{transform:scale(.95)}
.mt-invite .ic{width:15px;height:15px}
.mt-pair .avx.ghost{border-style:dashed;color:var(--ink-3)}
.mt-pair .avx .drop{
  position:absolute;right:-2px;top:-2px;width:18px;height:18px;border-radius:999px;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;
}
.mt-pair .avx .drop .ic{width:10px;height:10px;stroke-width:2.6}
.mt-row .more{
  width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
  transition:background .24s,transform .24s var(--ease);
}
.mt-row .more:active{transform:scale(.88)}
.mt-row .more .ic{width:18px;height:18px}
.mt-c{
  width:46px;height:46px;border-radius:999px;display:grid;place-items:center;color:var(--ink);
  transition:transform .24s var(--ease),background .24s;
}
.mt-c:active{transform:scale(.9)}
.mt-c .ic{width:22px;height:22px}
.mt-c.play{width:62px;height:62px;background:var(--ink);color:var(--bg)}
.mt-c.play .ic{width:24px;height:24px;fill:currentColor;stroke:none}
.mt-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mt-row{
  display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:18px;padding:10px 14px;
  transition:transform .24s var(--ease);
}
.mt-row:active{transform:scale(.98)}
.mt-row.cur{outline:1.2px solid var(--ink);outline-offset:-1.2px}
.mt-row .idx{font-size:11.5px;color:var(--ink-3);width:16px;font-variant-numeric:tabular-nums}
.mt-row .m{flex:1;min-width:0}
.mt-row .m .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-row .m .a{font-size:11px;color:var(--ink-3);margin-top:2px}
.mt-row .dur{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- 占卜 ---------- */
.div-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:999px;padding:4px;height:44px;position:relative;margin-bottom:16px}
#rsSeg{grid-template-columns:repeat(3,minmax(0,1fr))}
#rsSeg .pl{width:calc((100% - 8px)/3)}
.div-seg .pl{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc((100% - 8px)/2);background:var(--bg);border:1px solid var(--line);border-radius:999px;transition:transform .44s var(--ease)}
.div-seg button{position:relative;z-index:1;min-width:0;font-size:13.5px;color:var(--ink-2);border-radius:999px;transition:color .3s}
.div-seg button.active{color:var(--ink);font-weight:600}

.div-q{width:100%;height:50px;border-radius:999px;background:var(--surface);border:1px solid transparent;padding:0 18px;font-size:14px;color:var(--ink);outline:none;margin-bottom:14px;transition:border-color .3s}
.div-q:focus{border-color:var(--line-2)}
.div-q::placeholder{color:var(--ink-3)}
.div-hint{font-size:12px;color:var(--ink-3);line-height:1.7;margin:0 4px 14px}
.div-hint b{color:var(--ink);font-weight:600}

.deck-wrap{position:relative;margin-bottom:6px}
.deck-row{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 0 14px;
  scrollbar-width:none;
}
.deck-row::-webkit-scrollbar{display:none}
.dcard{
  flex:0 0 88px;height:140px;border-radius:14px;position:relative;scroll-snap-align:center;
  border:1px solid var(--line);background:var(--bg);overflow:hidden;
  transition:transform .3s var(--ease),opacity .3s,border-color .3s;
}
.dcard:active{transform:scale(.96)}
.dcard.back::after{
  content:"";position:absolute;inset:9px;border:1px solid var(--line);border-radius:8px;
}
.dcard.back .orn{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);opacity:.55}
.dcard.back .orn .ic{width:26px;height:26px;stroke-width:1.2}
.dcard.taken{opacity:.16;pointer-events:none}
.dcard.shuffling{animation:shuf .5s var(--ease) both}
@keyframes shuf{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-10px) rotate(-4deg)}100%{transform:none}}

.picked-row{display:flex;gap:9px;justify-content:center;min-height:118px;align-items:flex-start;margin:6px 0 4px}.picked{
  width:74px;height:118px;border-radius:12px;border:1px solid var(--ink);background:var(--bg);
  position:relative;display:grid;place-items:center;overflow:hidden;
  animation:pop .4s var(--ease) both;transition:transform .3s var(--ease);
}
.picked:active{transform:scale(.95)}
.picked .empty-mark{font-size:11px;color:var(--ink-3)}
.face{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 5px;background:var(--bg)}
.face.rev{transform:rotate(180deg)}
.face .fnum{font-size:8.5px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.face .fglyph{color:var(--ink)}
.face .fglyph .ic{width:26px;height:26px;stroke-width:1.1}
.face .fnm{font-size:9.5px;font-weight:600;text-align:center;line-height:1.25;color:var(--ink)}
.face.imgface{padding:0;overflow:hidden}
.face.imgface img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.picked .revtip{
  position:absolute;left:0;right:0;bottom:0;font-size:8px;text-align:center;padding:2px 0;
  background:var(--ink);color:var(--bg);letter-spacing:.08em;
}
.picked .orn{display:grid;place-items:center;width:100%;height:100%}

.div-actions{display:flex;gap:8px;margin:14px 0 6px}
.div-actions .mini{flex:1;justify-content:center;height:44px;font-size:13px}
.div-primary{
  width:100%;height:52px;border-radius:999px;background:var(--ink);color:var(--bg);
  font-size:15px;font-weight:600;margin-top:12px;transition:transform .24s var(--ease),opacity .3s;
}
.div-primary:active{transform:scale(.985)}
.div-primary[disabled]{opacity:.35;pointer-events:none}
.div-sec{
  width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:14px;color:var(--ink);margin-top:10px;
}
.card-note{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:10px;line-height:1.6}

/* ---------- 牌面管理 ---------- */
.deck-mgr{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.deck-mgr::-webkit-scrollbar{display:none}
.deck-mgr-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:14px;background:var(--surface)}
.dm-thumb{width:34px;height:46px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.dm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dm-idx{font-size:10px;color:var(--ink-3)}
.dm-name{flex:1;min-width:0;font-size:13px;color:var(--ink)}
.deck-mgr-row .mini{height:32px;padding:0 12px;font-size:12px;flex:0 0 auto}

/* ---------- 记忆库 / 文档 ---------- */
.mem-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;scrollbar-width:none}
.mem-list::-webkit-scrollbar{display:none}
.mem-row{display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.5;padding:10px 14px;border-radius:12px;background:var(--surface);border:1.4px solid transparent;color:var(--ink);transition:border-color .2s}
.mem-row.on{border-color:var(--ink)}
.doc-row{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;color:var(--ink)}
.doc-row:active{transform:scale(.99)}
.doc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.doc-title{font-size:15px;font-weight:650}
.doc-snippet{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:6px}
.doc-meta{font-size:11px;color:var(--ink-3)}
.rdot-inline{width:7px;height:7px;border-radius:999px;background:#e0322a;display:inline-block;flex:0 0 auto}
.doc-view-title{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.35;margin:2px 0 6px}
.doc-view-meta{font-size:11px;color:var(--ink-3);margin-bottom:14px}
.doc-body{font-size:15px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;margin-bottom:14px}
#docBody textarea{width:100%;min-height:56vh;background:transparent;border:0;border-radius:0;padding:0;font-size:15px;line-height:1.8;color:var(--ink);outline:none;resize:none;box-sizing:border-box;word-break:break-word}
#docTitleInput{width:100%;height:auto;background:transparent;border:0;border-radius:0;padding:0;font-size:22px;font-weight:700;color:var(--ink);outline:none;margin-bottom:16px}
.doc-comment{border-left:2.4px solid var(--ink);padding:8px 12px;margin-bottom:8px;background:var(--surface);border-radius:0 12px 12px 0}
.doc-comment .dc-who{font-size:11px;color:var(--ink-3);margin-bottom:3px}.doc-comment .dc-text{font-size:13px;line-height:1.55;color:var(--ink);word-break:break-word;overflow-wrap:anywhere}

/* ---------- 聊聊里的占卜卡消息 ---------- */
.msg.divi{justify-content:center;margin:14px 0;width:100%}
.msg.divi.out{justify-content:flex-end}.msg.divi.in{justify-content:flex-start}
.divi-box{
  width:100%;max-width:300px;border:1px solid var(--line);border-radius:22px;
  background:var(--surface);padding:13px 14px 12px;
}
.divi-author{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;font-weight:600}
.divi-author .mini-ava{width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:11px}
.divi-box .dq{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:10px}
.divi-box .dcards{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.divi-box .dc{width:58px;height:92px;border-radius:10px;border:1px solid var(--ink);overflow:hidden;background:var(--bg);position:relative}
.divi-box .dc .face{padding:5px 3px}
.divi-box .dc .face .fglyph .ic{width:18px;height:18px}
.divi-box .dc .face .fnm{font-size:7.5px}
.divi-box .dc .face .fnum{font-size:6.5px}
.divi-box .dc .rv{position:absolute;left:0;right:0;bottom:0;font-size:7px;text-align:center;background:var(--ink);color:var(--bg);padding:1px 0}
.divi-box .dsec{font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin:8px 0 6px;text-transform:uppercase}
.verdict{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 0}
.verdict .tag{
  font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--ink);
  white-space:nowrap;flex:0 0 auto;
}
.verdict .tag.s1{background:var(--ink);color:var(--bg)}
.verdict .txt{color:var(--ink);line-height:1.45;font-size:12px}
.verdict.pending .tag{border-style:dashed;color:var(--ink-3)}
.countdown{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-left:auto}
.divi-box .addinterp{
  width:100%;height:36px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;
  font-size:12px;color:var(--ink-2);margin-top:8px;
}

/* ---------- 聊天背景 ---------- */
.chat-bg{
  position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .4s var(--ease);pointer-events:none;
}
.chat-detail.has-bg .msg-scroll,.chat-detail.has-bg .chat-head{position:relative;z-index:1}
.chat-detail.has-bg .composer,.chat-detail.has-bg .panel{z-index:6}
.chat-bg.on{opacity:1}
.chat-detail.has-bg .chat-head{position:relative;z-index:2}
.chat-detail.has-bg .msg-scroll .bubble{
  background:rgba(255,255,255,.62);color:#0a0a0a;
  backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
}
.chat-detail.has-bg .msg.out .bubble{background:rgba(10,10,10,.82);color:#fff}
.chat-detail.has-bg .day,.chat-detail.has-bg .sys{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
:root[data-theme="dark"] .chat-detail.has-bg .msg-scroll .bubble{background:rgba(20,20,20,.66);color:#f6f6f6}
.msg.flash .bubble,.sys.flash{box-shadow:0 0 0 1.4px var(--ink);border-radius:19px}

/* ---------- 通话 ---------- */
.call-layer{
  position:absolute;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  opacity:0;pointer-events:none;transform:scale(1.03);
  transition:opacity .34s var(--ease),transform .42s var(--ease);
}
.call-layer.on{opacity:1;pointer-events:auto;transform:none}
.call-identity{position:relative;width:150px;height:150px;display:grid;place-items:center;flex:0 0 auto;margin-bottom:4px}
.call-ring{position:absolute;inset:0;width:150px;height:150px;display:grid;place-items:center;pointer-events:none}
.call-ring i{
  position:absolute;width:100%;height:100%;border-radius:999px;border:1px solid var(--line-2);
  animation:ringOut 3s var(--ease) infinite;
}
.call-ring i:nth-child(2){animation-delay:1.5s}
@keyframes ringOut{0%{transform:scale(.66);opacity:0}30%{opacity:.7}100%{transform:scale(1.5);opacity:0}}
.call-layer.incoming .call-ring i{animation-duration:1.6s}
.call-ava{
  width:104px;height:104px;border-radius:999px;border:1.4px solid var(--ink);
  display:grid;place-items:center;font-size:38px;font-weight:600;background:var(--bg);position:relative;z-index:2;overflow:hidden;
}
.call-ava img{width:100%;height:100%;object-fit:cover}
.call-name{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:20px;position:relative;z-index:2}.call-sub{font-size:13.5px;color:var(--ink-2);margin-top:8px;letter-spacing:.04em;font-variant-numeric:tabular-nums;position:relative;z-index:2}
.call-cap{font-size:11px;color:var(--ink-3);letter-spacing:.18em;margin-top:6px;position:relative;z-index:2}
.call-layer.talking .call-cap{opacity:.7}
.call-actions{
  position:absolute;left:0;right:0;bottom:64px;display:flex;align-items:center;justify-content:center;gap:42px;
}
.call-btn{
  display:flex;flex-direction:column;align-items:center;gap:9px;font-size:11px;color:var(--ink-2);
  transition:transform .22s var(--ease);
}
.call-btn:active{transform:scale(.9)}
.call-btn .ic{width:26px;height:26px}
.call-btn.hangup .ic,.call-btn.accept .ic{
  width:62px;height:62px;padding:18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);
}
.call-btn.hangup.solid .ic{background:var(--ink);color:var(--bg)}
.call-btn.hangup .ic{transform:rotate(135deg)}
.call-btn.accept .ic{background:var(--ink);color:var(--bg)}
.call-btn.accept{display:none}
.call-btn.hangup{order:2}
.call-btn.accept{order:1}
.call-btn#callMute{order:3}
.call-layer.incoming .call-btn.accept{display:flex}
.call-layer.incoming .call-btn.hangup .ic{background:transparent;color:var(--ink);border-color:var(--ink)}
.call-btn.on .ic{background:var(--surface-2);border-radius:999px}
.call-min{position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 54px);width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink);z-index:4}
.call-min .ic{width:18px;height:18px}
.call-compact{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 54px);height:66px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);display:none;align-items:center;gap:12px;padding:7px 10px 7px 8px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.call-layer.minimized .call-compact{display:flex}
.call-layer.minimized .call-identity,.call-layer.minimized .call-name,.call-layer.minimized .call-cap,.call-layer.minimized .call-actions,.call-layer.minimized .call-min{display:none!important}
.call-layer.minimized .call-sub{display:none}
.call-mini-ava{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-size:18px;font-weight:600}
.call-mini-ava img{width:100%;height:100%;object-fit:cover}
.call-mini-meta{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;text-align:left}
.call-mini-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-mini-time{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.call-mini-end{width:44px;height:44px;border-radius:50%;background:#d93636;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.call-mini-end .ic{width:20px;height:20px;transform:rotate(135deg)}
.call-layer.minimized{inset:auto;left:auto;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;width:54px;height:54px;transform:none;display:flex;justify-content:center;align-items:center;background:transparent;opacity:1;pointer-events:none;z-index:120}
.call-layer.minimized .call-compact{position:relative;inset:auto;display:flex;width:54px;height:54px;box-sizing:border-box;border-radius:50%;padding:4px;gap:0;pointer-events:auto;touch-action:none;cursor:grab;background:var(--glass);box-shadow:0 4px 18px rgba(0,0,0,.16);border:1px solid var(--glass-b)}
.call-layer.minimized .call-compact.dragging{cursor:grabbing;transition:none}
.call-layer.minimized .call-mini-ava{width:44px;height:44px;border:0}
.call-layer.minimized .call-mini-meta,.call-layer.minimized .call-mini-end{display:none!important}
.call-layer.minimized .call-actions{display:none}



/* ---------- 角色设置面板 ---------- */
#sp-roleset{z-index:38}
.set-group{margin-bottom:22px}
.set-group>.gt{
  font-size:11px;color:var(--ink-3);letter-spacing:.16em;margin:0 0 10px 6px;text-transform:uppercase;font-weight:600;
}
.set-group textarea{
  width:100%;min-height:120px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  padding:12px 14px;font-size:13px;line-height:1.6;color:var(--ink);outline:none;resize:vertical;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;
}
.set-group textarea:focus{border-color:var(--line-2)}
.set-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:9px 16px;border-radius:18px;background:var(--surface);margin-bottom:7px;
}
.set-item .lb{font-size:13.5px;color:var(--ink);flex:1;min-width:0;line-height:1.35}
.set-item .lb small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.set-num{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.set-num input{
  width:58px;height:34px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  text-align:center;font-size:13px;color:var(--ink);outline:none;font-variant-numeric:tabular-nums;
}
.set-num input:focus{border-color:var(--line-2)}
.set-num .u{font-size:11.5px;color:var(--ink-3)}
.set-seg{display:flex;gap:5px;background:var(--bg);border-radius:999px;padding:3px;border:1px solid var(--line)}
.set-seg button{padding:5px 10px;border-radius:999px;font-size:11.5px;color:var(--ink-2);transition:background .24s,color .24s}
.set-seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.set-switch{position:relative;width:44px;height:26px;flex:0 0 auto}
.set-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.set-switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s}
.set-switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:var(--ink-3);transition:transform .3s var(--ease),background .3s}
.set-switch input:checked+span{background:var(--ink);border-color:var(--ink)}
.set-switch input:checked+span::after{transform:translateX(18px);background:var(--bg)}
.set-color{display:flex;align-items:center;gap:8px}
.set-color input[type=color]{
  width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:none;padding:0;overflow:hidden;
}
.set-color input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.set-color input[type=color]::-webkit-color-swatch{border:none;border-radius:9px}
.set-note{font-size:11px;color:var(--ink-3);line-height:1.6;margin:8px 6px 0}

/* ---------- 表情面板 tabs ---------- */
.emo-tabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.emo-tab{
  height:28px;padding:0 12px;border-radius:999px;font-size:11.5px;color:var(--ink-2);
  border:1px solid var(--line);transition:background .24s,color .24s;
}
.emo-tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ---------- 长按菜单 / 贴纸 ---------- */
.ctxmenu{
  position:absolute;z-index:120;display:flex;gap:2px;padding:6px;border-radius:18px;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:var(--glass);border:1px solid var(--glass-b);
  backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);
  opacity:0;transform:scale(.92);transform-origin:center;pointer-events:none;
  transition:opacity .2s var(--ease),transform .24s var(--ease);
}
.ctxmenu.on{opacity:1;transform:none;pointer-events:auto}
.ctxmenu button{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:52px;min-height:48px;padding:6px 0;border-radius:13px;pointer-events:auto;
  font-size:9.5px;color:var(--ink);transition:background .2s;
}
.ctxmenu button:active{background:var(--surface)}
.ctxmenu .ic{width:18px;height:18px}
.bubble.stickered{position:relative}
.msg .stk{
  position:absolute;top:-9px;font-size:18px;line-height:1;z-index:2;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));pointer-events:none;
}
.msg .stk img{display:block;width:24px;height:24px;object-fit:contain}.msg.out .stk{left:-8px}
.msg.in .stk{right:-8px}
.msg .msgwrap{position:relative;width:fit-content;max-width:82%;min-width:0;box-sizing:border-box}
.quote-preview{
  display:none;align-items:center;gap:8px;min-width:0;max-width:100%;
  margin:0 12px 6px;padding:6px 10px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface);box-sizing:border-box;
  flex:0 0 auto;position:relative;z-index:2;
}
.quote-preview.on{display:flex}
.quote-preview-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.quote-preview-label{font-size:10px;line-height:1.2;color:var(--ink-3)}
.quote-preview-text{font-size:11.5px;line-height:1.35;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-preview-close{width:24px;height:24px;flex:0 0 24px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);font-size:18px;line-height:1;display:grid;place-items:center}
.quote-line{font-size:11.5px;padding:6px 10px;border-left:2px solid var(--ink-3);
  background:var(--surface);border-radius:8px;margin-bottom:6px;color:var(--ink-2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.who{font-size:10.5px;color:var(--ink-3);margin-bottom:4px;padding-left:4px;letter-spacing:.02em}
.readmark{font-size:10px;color:var(--ink-3);letter-spacing:.02em;margin-top:4px;display:flex;justify-content:flex-end;gap:4px;align-items:center}
.readmark .ic{width:12px;height:12px}

/* ---------- 红包 ---------- */
.rp{
  min-width:210px;border-radius:18px;overflow:hidden;border:1px solid var(--ink);
  background:var(--bg);cursor:pointer;
}
.rp-top{display:flex;align-items:center;gap:10px;padding:13px 15px}
.rp-ico{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.rp-ico .ic{width:20px;height:20px}
.rp-tx{flex:1;min-width:0}
.rp-tx .n{font-size:13.5px;font-weight:600;color:var(--ink)}
.rp-tx .s{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.rp-note{font-size:12px;padding:0 15px 12px;color:var(--ink-2);line-height:1.45}
.rp-foot{font-size:9.5px;color:var(--ink-3);padding:0 15px 11px;letter-spacing:.06em}
.msg.out .rp{background:var(--boost);border-color:var(--boost)}
.msg.out .rp .rp-tx .n{color:var(--boost-ink)}
.msg.out .rp .rp-tx .s,.msg.out .rp .rp-note,.msg.out .rp .rp-foot{color:rgba(255,255,255,.6)}
.msg.out .rp-ico{background:var(--boost-ink);color:var(--boost)}

/* ---------- 红包弹窗 ---------- */
.rp-overlay{
  position:absolute;inset:0;z-index:70;display:grid;place-items:center;
  background:rgba(0,0,0,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.rp-overlay.on{opacity:1;pointer-events:auto}
.rp-pop{
  position:relative;width:min(318px,82%);padding:30px 22px 22px;border-radius:26px;text-align:center;
  background:linear-gradient(158deg,#ef5548 0%,#cf3229 52%,#a91e19 100%);
  color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.38);
  transform:translateY(20px) scale(.88);opacity:0;
  transition:transform .42s cubic-bezier(.34,1.5,.64,1),opacity .3s var(--ease);
}
.rp-overlay.on .rp-pop{transform:none;opacity:1}
.rp-pop::before{content:"";position:absolute;inset:9px;border-radius:19px;border:1px solid rgba(255,255,255,.28);pointer-events:none}
.rp-close{
  position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:999px;z-index:2;
  background:rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;transition:background .2s;
}
.rp-close:active{background:rgba(0,0,0,.34)}
.rp-close .ic{width:15px;height:15px}
.rp-pop-label{font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.88);margin-top:2px}
.rp-amt-big{
  font-size:44px;font-weight:800;letter-spacing:-.02em;margin:16px 0 2px;line-height:1;
  font-variant-numeric:tabular-nums;color:#ffe8ad;text-shadow:0 3px 16px rgba(0,0,0,.28);
  animation:rpPop .55s var(--ease) both;
}
.rp-pop-note{font-size:13px;color:rgba(255,255,255,.94);margin:12px 14px 0;line-height:1.55;min-height:18px;white-space:pre-wrap}
.rp-pop-status{font-size:11px;color:rgba(255,255,255,.72);margin-top:13px;letter-spacing:.06em}
.rp-actions{display:flex;gap:10px;margin-top:22px}
.rp-actions .rp-btn{flex:1;height:46px;border-radius:999px;font-size:14.5px;font-weight:650;transition:transform .2s var(--ease),opacity .3s,filter .2s}
.rp-actions .rp-btn:active{transform:scale(.95)}
.rp-actions .rp-btn.primary{background:#ffe8ad;color:#7f2118}
.rp-actions .rp-btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.34)}
@keyframes rpPop{0%{opacity:0;transform:translateY(16px) scale(.55)}100%{opacity:1;transform:none}}

/* ---------- 语音录音弹窗 ---------- */
.voice-overlay{
  position:absolute;inset:0;z-index:72;display:grid;place-items:center;
  background:rgba(0,0,0,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
}
.voice-overlay.on{opacity:1;pointer-events:auto}
.voice-pop{
  position:relative;width:min(300px,82%);padding:30px 22px 24px;border-radius:24px;text-align:center;
  background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);
  transform:translateY(18px) scale(.92);opacity:0;
  transition:transform .4s cubic-bezier(.34,1.5,.64,1),opacity .3s var(--ease);
}
.voice-overlay.on .voice-pop{transform:none;opacity:1}
.voice-dot{width:18px;height:18px;border-radius:999px;background:#e53935;margin:4px auto 12px}.voice-dot.on{animation:voicePulse 1s var(--ease) infinite}
@keyframes voicePulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.45)}70%{box-shadow:0 0 0 16px rgba(229,57,53,0)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}
.voice-status{font-size:15px;font-weight:600}
.voice-time{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.voice-actions{display:flex;gap:10px;margin-top:18px}
.voice-actions .rp-btn{flex:1;height:46px;border-radius:999px;font-size:14.5px;font-weight:650;transition:transform .2s var(--ease),opacity .3s}
.voice-actions .rp-btn:active{transform:scale(.96)}
.voice-actions .rp-btn.primary{background:var(--ink);color:var(--bg)}
.voice-actions .rp-btn.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}

/* ---------- 涂鸦 ---------- */
#ddCanvas{
  width:100%;max-width:100%;aspect-ratio:1/1;border-radius:22px;border:1px solid var(--line);
  background:var(--bg);touch-action:none;display:block;
}
.dd-tools{margin-top:14px}
.dd-swatches{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.dd-sw{width:30px;height:30px;border-radius:999px;border:2px solid var(--line);transition:transform .2s var(--ease),border-color .2s}
.dd-sw.on{border-color:var(--ink);transform:scale(1.08)}
.dd-row{display:flex;gap:8px;align-items:center}
.dd-hex{
  flex:1;height:40px;border-radius:999px;background:var(--surface);border:1px solid transparent;padding:0 14px;
  font-size:12.5px;color:var(--ink);outline:none;
}
.dd-hex:focus{border-color:var(--line-2)}
.dd-size{width:56px;height:40px;border-radius:999px;background:var(--surface);border:1px solid transparent;text-align:center;font-size:12.5px;color:var(--ink);outline:none}
.dd-sizewrap{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2);flex:0 0 auto}
.dd-sizewrap .dd-size{width:32px;height:26px;padding:0 2px;background:transparent;border:0;font-size:13px;color:var(--ink)}
.dd-btn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink)}
.dd-btn.on{background:var(--ink);color:var(--bg)}

/* ---------- 信箱 ---------- */
.letter{
  position:relative;border-radius:14px;padding:20px 18px;margin-bottom:14px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .4s var(--ease),max-height .5s var(--ease);
}
.letter .wax{
  position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:999px;
  border:1px solid var(--ink);display:grid;place-items:center;
}
.letter .wax .ic{width:12px;height:12px;color:var(--ink)}
.letter .letter-identity{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-right:30px}
.letter-ava{width:34px;height:34px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:0 0 auto;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.letter .lh{font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.letter .to{font-size:14px;font-weight:600;margin-bottom:12px}
.letter .body{
  font-family:"Songti SC","Georgia",serif;font-size:14px;line-height:1.85;color:var(--ink);
  white-space:pre-wrap;max-height:0;opacity:0;overflow:hidden;
  background:none!important;background-image:none!important;border:0;box-shadow:none;
  transition:max-height .55s var(--ease),opacity .4s var(--ease);
}
.letter .body::before,.letter .body::after{content:none!important;display:none!important}
.letter.open .body{max-height:2000px;opacity:1}
.letter-images{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.letter-images img{width:76px;height:76px;object-fit:cover;border-radius:10px}
.letter .sign{
  margin-top:14px;text-align:right;font-family:"Songti SC","Georgia",serif;font-size:12.5px;color:var(--ink-2);
  opacity:0;transition:opacity .4s var(--ease) .2s;
}
.letter.open .sign{opacity:1}
.letter .peek{
  font-size:12.5px;color:var(--ink-3);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.letter.open .peek{display:none}
.letter .rdot{
  position:absolute;left:10px;top:10px;width:7px;height:7px;border-radius:999px;background:#e0322a;
}
.letter.unread{border-color:var(--line-2)}

/* 未读红点 */
.dot{
  width:7px;height:7px;border-radius:999px;background:#e0322a;display:inline-block;
  position:absolute;transform:translate(2px,-2px);
}
.tile{position:relative}
.tile .dot{right:16px;top:16px;width:8px;height:8px}
.row-badge{min-width:18px;height:18px;border-radius:999px;background:var(--ink);color:var(--bg);
  font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-weight:600;
}

/* ---------- 表情包管理 ---------- */
.stk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stk-cell{
  position:relative;aspect-ratio:1/1;border-radius:14px;background:var(--surface);overflow:hidden;
  display:grid;place-items:center;border:1.4px solid transparent;
}
.stk-cell img{width:100%;height:100%;object-fit:cover}
.stk-cell.sel{border-color:var(--ink)}
.stk-cell .sel-mark{
  position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:999px;background:var(--ink);
  color:var(--bg);display:grid;place-items:center;
}
.stk-cell .sel-mark .ic{width:10px;height:10px;stroke-width:3}
.stk-add{
  aspect-ratio:1/1;border-radius:14px;border:1.4px dashed var(--line-2);
  display:grid;place-items:center;color:var(--ink-2);
}
.stk-add .ic{width:20px;height:20px}

/* ---------- 查岗 ---------- */
.pat-hint{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px}

/* ============ 动画 ============ */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}

.listen-invite-card{width:min(280px,82%);margin:10px auto;padding:16px 16px 13px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 5px 20px rgba(0,0,0,.06);text-align:center}
.listen-invite-title{font-size:14px;font-weight:650;letter-spacing:.02em}.listen-invite-desc{font-size:12px;color:var(--ink-3);margin:7px 0 13px}.listen-invite-actions{display:flex;justify-content:center;gap:9px;align-items:center}.listen-invite-actions button{border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--bg);padding:7px 19px;font-size:12px}.listen-invite-actions button+button{background:transparent;color:var(--ink)}.listen-wait,.listen-result{font-size:12px;color:var(--ink-2)}
.mt-pair .avx img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}

</style>
</head>

<script>
(function(){
  const $  = (s,r)=> (r||document).querySelector(s);
  const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const first = s => (String(s||'?').trim()[0]) || '?';
  // 全局头像读取：用户头像来自个人设置，角色头像来自对应角色资料。
  function avatarHTML(person, className){
    const cls = className || 'mini-ava';
    const name = person && person.name ? person.name : '我';
    const src = person && person.avatar ? person.avatar : '';
    return '<span class="'+cls+'">'+(src ? '<img src="'+esc(src)+'" alt="">' : esc(first(name)))+'</span>';
  }
  function roleByName(name){ return S.chats.find(x=>x.type==='role' && x.name===name) || null; }

  /* ---------- 状态 ---------- */
  /* 角色设置的默认值（所有概率都可调） */
  const defRole = () => ({
    /* 聊天设置 */
    minReply:1, maxReply:3,
    minDelay:2, maxDelay:6,
    allowProactive:true, proactiveProb:30, proactiveCoolValue:10, proactiveCoolUnit:'分',
    cardRatio:70, emojiRatio:30,
    allowQuote:true, quoteProb:20,
    allowPatBack:true, patBackProb:40,
    allowRedpacket:true, redpacketProb:15, redpacketNoteProb:60,
    redpacketRejectProb:20, redpacketDecisionSeconds:6,
    allowCall:true, callProb:30, callCoolValue:15, callCoolUnit:'分',
    dropCallProb:20, refuseCallProb:30,
    stickerProb:25,
    memoryPickupProb:3,
    readNoReply:false, readNoReplyProb:20,
    showReadMark:true, readMarkStyle:'text',
    stampPos:'center',
    bubbleMine:'#111111', bubblePeer:'#f2f2f2',
    bubbleFontSize:15, glassBubble:false,
    customBubbleCSS:'',
    patText:'拍了拍我',
    /* 朋友圈设置 */
    allowMoment:true, momentProb:25,
    likeProb:45, commentProb:25,
    momentCardMin:1, momentCardMax:2,
    momentImgMin:0, momentImgMax:1,
    momentCoolValue:30, momentCoolUnit:'分',
    /* 信封设置 */
    allowLetter:true, letterCoolValue:3, letterCoolUnit:'天',
    letterCardMin:1, letterCardMax:3,
    letterImg:true, letterImgMin:0, letterImgMax:2,
    letterReplyMinValue:1, letterReplyMinUnit:'时',
    letterReplyMaxValue:6, letterReplyMaxUnit:'时',
    letterEmoji:true,
    /* 一起听 */
    allowListenInvite:true, listenInviteProb:30, refuseListenProb:30, listenDecisionSeconds:3,
    /* 文档阅读 */
    allowDocComment:true, docCommentProb:20, docCommentMin:1, docCommentMax:2,
    /* 群聊（仅群聊使用） */
    speakCount:2
  });
  const mergeRole = (o) => Object.assign(defRole(), o || {});

  const KEY = 'zikao.ui.v1';
  const defaults = ()=>({
    theme:'light', filter:'all', activeGroup:null, me:{name:'我', sign:''},
    chats:[],
    groups:[],
    covers:{ moment:'' },
    moments:[],
    tracks:[],
    listenWith:null,
    playMode:'order'
  });
  let S;
  try{ S = JSON.parse(localStorage.getItem(KEY)) || defaults(); }catch(e){ S = defaults(); }
  // 字卡分组缺失/为空时只恢复分组，不重置聊天、信封、朋友圈等其他本地数据
  if(!S.groups || !S.groups.length) S.groups = defaults().groups.slice();
  S.covers = S.covers || {moment:''};
  if(!S.playMode) S.playMode = 'order';S.meSettings = Object.assign({patText:'拍了拍我'}, S.meSettings || {});
  S.stickers = Object.assign({mine:[], roles:[]}, S.stickers || {});
  S.letters = S.letters || [];
  S.moments = S.moments || [];
  (S.chats||[]).forEach(function(c){
    c.settings = mergeRole(c.settings);
    c.msgs = c.msgs || [];
    c.unread = c.unread || 0;
    if(c.type === 'role') c.memories = c.memories || [];
  });
  // 清理旧版贴纸：曾误存为 HTML 字符串，避免消息里出现代码
  (S.chats||[]).forEach(function(c){
    (c.msgs||[]).forEach(function(m){
      if(m && m.sticker && typeof m.sticker === 'string' && /^\s*</.test(m.sticker)) delete m.sticker;
    });
  });
  S.moments = S.moments || [];
  S.tracks = S.tracks || [];

  function handleListenInviteChoice(id, accept){
    const c=currentChat(); if(!c) return;
    const m=(c.msgs||[]).find(x=>x.id===id && x.t==='listenInvite'); if(!m || m.status!=='pending') return;

  /* 往指定会话写一条消息（即使不在当前聊天里） */
  function addMsgTo(chat, msg){
    if(!chat) return;
    chat.msgs = chat.msgs || [];
    msg.id = msg.id || uid();
    msg.ts = msg.ts || Date.now();
    chat.msgs.push(msg);
    if(msg.t !== 'sys' && msg.t !== 'call'){
      chat.last = msg.text || chat.last;
      const n = new Date();
      chat.time = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    }
    save(); renderChats();
    if(activeChatId === chat.id) appendMsg(msg);
  }

  function pushMsgTo(c, msg){
    if(!c) return;
    msg.id = msg.id || uid();
    c.msgs.push(msg);
    if(msg.text) c.last = msg.text;
    const n = new Date();
    c.time = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    if(activeChatId !== c.id) c.unread = (c.unread||0) + 1;
    save(); renderChats();
    if(activeChatId === c.id) appendMsg(msg);
  }

  function pushMsg(msg, animate){
    msg.dir = 'out';
    msg.id = msg.id || uid();
    msg.ts = msg.ts || Date.now();
    const c = currentChat(); if(!c) return;
    c.msgs.push(msg);
    c.last = msg.text || (msg.t==='image'?'[图片]':msg.t==='video'?'[视频]':msg.t==='voice'?'[语音]':msg.t==='doodle'?'[涂鸦]':msg.t==='redpacket'?'[红包]':msg.t==='divi'?'[占卜]':'[消息]');
    const n = new Date();
    c.time = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    save(); renderChats();
    if(activeChatId===c.id) appendMsg(msg);
    maybeStickerUserMessage(c, msg);
  }

  /* 角色给用户消息贴贴纸：从「和用户一致的」emoji 贴纸里选一个，8 秒内贴上 */
  function userStickerPool(){
    const pool = [];
    (Array.isArray(EMOJI) ? EMOJI : []).forEach(function(e){ pool.push({kind:'emoji', value:String(e)}); });
    const mine = Array.isArray(S.stickers && S.stickers.mine) ? S.stickers.mine : [];
    mine.forEach(function(x){
      if(typeof x === 'string') pool.push({kind:'emoji', value:x});
      else if(x && x.kind === 'img' && x.src) pool.push({kind:'img', src:x.src});
      else { const v = x && (x.text || x.emoji || x.value); if(v) pool.push({kind:'emoji', value:String(v)}); }
    });
    return pool;
  }
  function maybeStickerUserMessage(c, msg){
    if(!c || c.type !== 'role' || !msg || msg.sticker) return;
    const st = c.settings || defRole();
    const prob = Math.max(0, Math.min(100, Number(st.stickerProb === '' || st.stickerProb == null ? 25 : st.stickerProb)));
    if(Math.random()*100 >= prob) return;
    const pool = userStickerPool();
    if(!pool.length) return;
    const chosen = pick(pool);const delay = 1500 + Math.random()*6500; // 角色拥有 8 秒时间做选择
    setTimeout(function(){
      if(!S.chats.some(x => x.id === c.id)) return;
      const m = (c.msgs||[]).find(x => x.id === msg.id);
      if(!m || m.sticker) return;
      if(chosen.kind === 'img') m.sticker = {kind:'img', src:chosen.src};
      else m.sticker = chosen.value;
      save(); renderChats();
      if(activeChatId === c.id) renderMessages(false);
    }, delay);
  }

  /* 输入栏 */
  const composer = $('#composer'), chatInput = $('#chatInput');
  chatInput.addEventListener('input', ()=>{
